# Development database only. Production deployment does not use this file.
#
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#
# Provides:
#   - highjack       main dev database        (localhost:5432)
#   - highjack_test  disposable test database (localhost:5433)
#
# Credentials are deliberately trivial and local-only.
#
# PostgreSQL 18 changed the image's layout: PGDATA became version-specific
# (/var/lib/postgresql/18/docker) and the declared VOLUME moved from
# /var/lib/postgresql/data to /var/lib/postgresql. The mounts below target the
# new location. Mounting the old path is not a no-op — the database initialises
# somewhere the mount does not cover, and the container never accepts
# connections, which is how the first attempt at this bump failed in CI.

services:
  postgres:
    image: postgres:18-alpine
    container_name: highjack-postgres-dev
    environment:
      POSTGRES_USER: highjack
      POSTGRES_PASSWORD: highjack
      POSTGRES_DB: highjack
    ports:
      - '5432:5432'
    volumes:
      - highjack-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U highjack']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:18-alpine
    container_name: highjack-postgres-test
    environment:
      POSTGRES_USER: highjack
      POSTGRES_PASSWORD: highjack
      POSTGRES_DB: highjack_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U highjack']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  highjack-pgdata:
