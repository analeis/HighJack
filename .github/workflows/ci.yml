name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, tests, build, browser verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        # Node runtime is required by Playwright's driver; Bun drives everything else.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every step below invokes a gate defined in scripts/lib/validation-gates.ts
      # via `bun scripts/gate.ts <name>`. CI deliberately does not restate the
      # commands: a second copy of the gate list is a second thing to forget to
      # update, and that is how the database step came to filter out the tests
      # it was supposed to run (audit OPS-2).
      - name: Dependency audit
        run: bun scripts/gate.ts audit:deps

      - name: Format check
        run: bun scripts/gate.ts format

      - name: Lint (TypeScript)
        run: bun scripts/gate.ts lint:eslint

      - name: Typecheck
        run: |
          bun scripts/gate.ts typecheck:tsc
          bun scripts/gate.ts typecheck:astro

      - name: Unit tests
        run: |
          bun scripts/gate.ts test:ts

      - name: Build website & game client
        run: |
          bun scripts/gate.ts build:web
          bun scripts/gate.ts build:game

      - name: Browser verification (Playwright + axe)
        # The Playwright config starts the real Go server and the game
        # client's production preview alongside the website, so the game UI
        # is verified against the authoritative backend, not a mock.
        run: |
          (cd apps/web && bunx playwright install --with-deps chromium)
          bun scripts/gate.ts verify:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  backend:
    name: Backend — vet, tests, container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Formatting (gofmt)
        run: bun scripts/gate.ts lint:gofmt

      - name: Vet
        run: bun scripts/gate.ts lint:govet

      - name: Vulnerability scan
        run: bun scripts/gate.ts audit:govuln

      # -count=1 -race: the match runtime and realtime handler are concurrent
      # by design, and a cached green result is not evidence.
      - name: Tests (hermetic, race detector)
        run: bun scripts/gate.ts test:go

      - name: Database migration and match persistence
        # Migration correctness needs a real PostgreSQL: an in-memory fake
        # cannot prove SQL, transactions, or constraints. The gate runs the
        # entire persistence package — no -run filter, so it cannot match
        # zero tests and still exit 0.
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml up -d postgres-test
          for i in $(seq 1 30); do
            docker exec highjack-postgres-test pg_isready -U highjack >/dev/null 2>&1 && break
            sleep 1
          done
          HIGHJACK_TEST_DATABASE_URL="postgres://highjack:highjack@127.0.0.1:5433/highjack_test?sslmode=disable" \
            bun scripts/gate.ts test:go:db
          docker compose -f infra/docker/docker-compose.dev.yml down -v

      - name: Build binary
        run: bun scripts/gate.ts build:server

      - name: Build container image
        run: docker build -f infra/docker/Dockerfile.server -t highjack-server:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name hj-smoke -p 8080:8080 highjack-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then echo healthy; exit 0; fi
            sleep 1
          done
          echo "container failed health check"; docker logs hj-smoke; exit 1

  repository:
    name: Repository — assets & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Asset validation
        run: bun scripts/gate.ts assets

      - name: Repository sanity
        run: bun scripts/gate.ts repo
