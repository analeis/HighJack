name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, tests, build, browser verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        # Node runtime is required by Playwright's driver; Bun drives everything else.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx prettier --check .

      - name: Lint (TypeScript)
        run: bunx eslint packages apps

      - name: Typecheck
        run: |
          bunx tsc --noEmit -p tsconfig.json
          (cd apps/web && bun run check)

      - name: Unit tests
        run: |
          (cd packages/protocol && bunx vitest run)
          (cd packages/ui && bunx vitest run)
          (cd apps/game && bunx vitest run)

      - name: Build website & game shell
        run: |
          (cd apps/web && bun run build)
          (cd apps/game && bun run build)

      - name: Browser verification (Playwright + axe)
        run: (cd apps/web && bunx playwright install --with-deps chromium && bunx playwright test)

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  backend:
    name: Backend — vet, tests, build, container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Formatting (gofmt)
        run: test -z "$(gofmt -l ./server)" || { gofmt -l ./server; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests (hermetic)
        run: go test -race ./...

      - name: Build binary
        run: go build -o /tmp/highjack-server ./server/cmd/highjack

      - name: Build container image
        run: docker build -f infra/docker/Dockerfile.server -t highjack-server:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name hj-smoke -p 8080:8080 highjack-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then echo healthy; exit 0; fi
            sleep 1
          done
          echo "container failed health check"; docker logs hj-smoke; exit 1

  repository:
    name: Repository — assets & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Asset validation
        run: bun scripts/check-assets.ts

      - name: Repository sanity
        run: bun scripts/repo-sanity.ts
